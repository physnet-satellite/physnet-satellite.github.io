website:
  title: "Physical Networks"
  description: "Website and archive for the Physical Networks NetSci satellite series."
  site-url: "https://physnet-satellite.github.io/"
  repo-url: "https://github.com/physnet-satellite/physnet-satellite.github.io"
  favicon: assets/img/common/logos/common_logo_physnet-mark.png
  navbar:
    background: "white"
    foreground: "#4f5b66"
    pinned: true
    left:
      - text: "Home"
        href: index.qmd
      - text: "Archive"
        href: archive.qmd
      - text: "Editions"
        menu:
          - text: "2026, Boston"
            href: editions/2026/index.qmd
          - text: "2025, Maastricht"
            href: editions/2025/index.qmd
          - text: "2024, Québec City"
            href: editions/2024/index.qmd
          - text: "2023, Vienna"
            href: editions/2023/index.qmd
      - text: "Links"
        href: links.qmd
    right:
      - icon: github
        href: "https://github.com/physnet-satellite/physnet-satellite.github.io"
        aria-label: "GitHub repository"
  page-footer:
    left: "Physical Networks Satellite Series"
    right: "Static site built with Quarto."
  search: true
  page-navigation: true
  back-to-top-navigation: true

format:
  html:
    theme: default
    css: assets/styles.css
    toc: true
    toc-depth: 3
    smooth-scroll: true
    link-external-icon: false
    link-external-newwindow: true
    code-copy: true
    anchor-sections: true
    fontsize: 1rem
    linkcolor: "#1f4e79"

execute:
  freeze: auto
